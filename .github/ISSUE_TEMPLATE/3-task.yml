name: Task
description: Task-like work a session could pick up — a fix, a measurement, a doc repair.
title: "[ID] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "Research tasks (label research) need a committed pre-registration before any arm runs. Conventions: docs/superpowers/ISSUES.md."
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: In plain language.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Path or permalink to the document that owns this finding. Figures are cited there, never restated here.
    validations:
      required: true
  - type: dropdown
    id: whose
    attributes:
      label: Whose is it?
      description: "owner-decision = a session prepares it, never makes it. owner-hands = needs him physically."
      options:
        - "A session's"
        - "The owner's decision (label owner-decision)"
        - "The owner's hands (label owner-hands)"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable end state. A PR saying "Closes #N" must be able to satisfy it.
    validations:
      required: true
  - type: dropdown
    id: reads
    attributes:
      label: Reads contracts
      description: "Shared meanings this work ASSUMES and would be wrong if they changed underneath it. Defined in ISSUES.md §5. Pick none if it touches none. Two live issues conflict when one changes a contract the other reads or changes."
      multiple: true
      options:
        - "none"
        - "graph-identity"
        - "apg1-format"
        - "quantities"
        - "cost-function"
        - "requirements"
        - "api-wire"
        - "url-state"
        - "edge-behaviour"
        - "deploy-path"
        - "rituals"
    validations:
      required: true
  - type: dropdown
    id: changes
    attributes:
      label: Changes contracts
      description: "Shared meanings this work would ALTER — not files it edits: would work that never opens those files be made wrong by it? A PR that changes one says so in its body, and closeout notifies every open issue that reads it (ISSUES.md §5)."
      multiple: true
      options:
        - "none"
        - "graph-identity"
        - "apg1-format"
        - "quantities"
        - "cost-function"
        - "requirements"
        - "api-wire"
        - "url-state"
        - "edge-behaviour"
        - "deploy-path"
        - "rituals"
    validations:
      required: true
