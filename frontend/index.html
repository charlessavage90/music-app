<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/unsung-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unsung.fm</title>
    <!--
      Issue #191. Link previews (chat apps, social cards) come from crawlers
      that do not run JavaScript, so they read ONLY these static tags — the
      same preview for every link. The tab title naming both artists is set at
      runtime (useDocumentTitle), which a crawler never sees. A preview naming
      a journey's artists needs the page rendered at the edge per link; the
      site is a static SPA on S3/CloudFront, and that is not attempted here.
      Copy is the landing page's own hero text.
    -->
    <meta
      name="description"
      content="Hear what lives between two artists you love. Name two, and Unsung.fm builds a listenable path between them, with a 30-second clip at every step."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unsung.fm" />
    <meta property="og:title" content="Unsung.fm" />
    <meta
      property="og:description"
      content="Hear what lives between two artists you love. Name two, and Unsung.fm builds a listenable path between them, with a 30-second clip at every step."
    />
    <meta property="og:url" content="https://unsung.fm/" />
    <meta property="og:image" content="https://unsung.fm/unsung-mark.png" />
    <meta property="og:image:width" content="1152" />
    <meta property="og:image:height" content="1152" />
    <meta property="og:image:alt" content="The Unsung.fm mark" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!--
      FRO-7 / RMD-12. Anything that stops the JavaScript arriving renders the
      same thing without this: a white screen with no text, which a friend
      cannot describe and nobody can diagnose from a report of it.

      It MUST live inside #root. React's createRoot clears the container it
      owns, so placed here it disappears the moment the app mounts; placed
      beside #root it would sit under the app forever. A test asserts both
      halves — that a browser running no JS at all sees words, and that none of
      this survives the mount.
    -->
    <div id="root">
      <div
        style="
          font-family: system-ui, sans-serif;
          max-width: 32rem;
          margin: 4rem auto;
          padding: 0 1rem;
          line-height: 1.5;
        "
      >
        <h1>Unsung.fm</h1>
        <p>Loading&hellip;</p>
        <p>
          If this message is still here in a few seconds, the app did not load.
          Reload the page. If reloading does not fix it, the site needs
          attention — tell whoever sent you the link.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
